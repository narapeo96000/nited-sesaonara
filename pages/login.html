<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบนิเทศ | สพม.นราธิวาส</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body{background:linear-gradient(135deg,#f1f6f8,#e5eef3);min-height:100vh;display:grid;place-items:center;padding:22px}.login-shell{width:min(100%,420px)}.login-brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px;color:#0b2d5c}.login-brand .logo{width:44px;height:44px;border-radius:14px;background:#0e8f6f;color:#fff;display:grid;place-items:center;font-weight:700;font-size:21px}.login-brand b,.login-brand small{display:block}.login-brand small{font-size:11px;color:#738296;margin-top:3px}.login-box{background:#fff;border:1px solid #e2e9ef;border-radius:16px;padding:32px;box-shadow:0 20px 55px rgba(11,45,92,.12)}.login-box h1{font-size:23px;color:#0b2d5c;margin:0 0 7px}.login-box>p{font-size:12px;color:#718196;margin:0 0 25px}.login-box .form-group{margin-bottom:16px}.login-box label{display:block;font-size:12px;font-weight:600;margin-bottom:7px;color:#344d68}.login-box input{width:100%;padding:12px;border:1px solid #dce5ec;border-radius:8px;font:inherit;font-size:13px}.login-box input:focus{outline:2px solid #0e8f6f33;border-color:#0e8f6f}.login-box .btn-primary{width:100%;justify-content:center;margin-top:4px}.login-back{display:block;text-align:center;margin-top:18px;text-decoration:none;color:#0e8f6f;font-size:12px}.login-help{margin-top:17px;padding:12px;background:#f3f7fa;border-radius:8px;color:#63758b;font-size:11px;line-height:1.7}
  </style>
</head>
<body>
  <main class="login-shell">
    <a class="login-brand" href="../index.html"><span class="logo">น</span><span><b>ระบบนิเทศออนไลน์</b><small>สพม.นราธิวาส</small></span></a>
    <section class="login-box">
      <h1>เข้าสู่ระบบ</h1><p>สำหรับผู้ดูแลระบบ ผู้นิเทศ และโรงเรียนในสังกัด</p>
      <div id="loginError" class="alert alert-danger" style="display:none;"></div>
      <form onsubmit="event.preventDefault();handleLogin();">
        <div class="form-group"><label for="loginUsername">ชื่อผู้ใช้</label><input id="loginUsername" name="username" autocomplete="username" required></div>
        <div class="form-group"><label for="loginPassword">รหัสผ่าน</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
      </form>
      <div class="login-help">หากยังไม่มีบัญชีผู้ใช้ โปรดติดต่อผู้ดูแลระบบของสำนักงานเขตพื้นที่การศึกษามัธยมศึกษานราธิวาส</div>
      <a class="login-back" href="../index.html">← กลับหน้าหลัก</a>
    </section>
  </main>
  <script src="../js/config.js"></script><script src="../js/app.js"></script>
</body>
</html>
